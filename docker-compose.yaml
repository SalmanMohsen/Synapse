

services:
  frontend:
    build:
      context: ./frontend
      target: builder          # ← use the Node stage, not Nginx
    command: npm run dev -- --host 
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app 
      - /app/node_modules
    environment:
      - ENV=development
    networks:
      - synapse-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend 
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${SECRET_KEY}
      - FRONTEND_URL=http://localhost:5173    
      - BACKEND_URL=http://localhost:8000     
      - COOKIE_SECURE=false  
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synapse-network

  postgres:
    image: postgres:17-alpine
    container_name: synapse-postgres
    restart: always
    environment:
      # Pulls directly from the .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - synapse-network

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - synapse-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: synapse-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - synapse-network
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: synapse-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - synapse-network

  planning-service:
    build:
      context: ./planning-service
    container_name: synapse-planning-service
    restart: always
    # Lets the container reach a vLLM server running in a host venv (this is
    # your current setup) via host.docker.internal. Docker Desktop (Mac/
    # Windows) resolves this automatically; this mapping is what makes it
    # work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1 
      - REDIS_URL=redis://redis:6379/0
      - PLANNING_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64}
      - REPO_CLONE_ROOT=/data/repos
      - HF_HUB_DISABLE_XET=1 
    volumes:
      - ./planning-service:/app
      - repo_data:/data/repos  
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant: 
        condition: service_started
    networks:
      - synapse-network

  code-service:
    build:
      context: ./code-service
    container_name: synapse-code-service
    restart: always
    # Docker-outside-of-Docker: talk to the HOST daemon to spin up sandbox
    # containers (Step 2), not a nested daemon.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CODE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64}
      - CODE_REPO_WORK_ROOT=/data/code-repos
      - CODE_REPO_WORK_ROOT_HOST=${CODE_REPO_WORK_ROOT_HOST:-./data/code-repos} 
      - CODE_SANDBOX_IMAGE=synapse-code-sandbox:latest
      - LITELLM_LOG=DEBUG
    volumes:
      - ./code-service:/app
      - ${CODE_REPO_WORK_ROOT_HOST:-./data/code-repos}:/data/code-repos
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - synapse-network

  code-sandbox:
    build:
      context: ./code-service/sandbox
    image: synapse-code-sandbox:latest
    profiles:
      - setup
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  repo_data:
  hf_cache:

networks:
  synapse-network:
    driver: bridge